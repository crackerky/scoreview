<svg xmlns="http://www.w3.org/2000/svg" width="360" height="245" viewBox="0 0 360 245"><title>Background pattern</title>
  <!-- 参照サイトの大会ページの背景画像(def_bgimg.png)は実際には黒一色。ほぼ黒の地に目立たない模様を重ねる -->
  <rect width="360" height="245" fill="#000"/>
  <g fill="none" stroke="#0d0d0d" stroke-width="2">
    <ellipse cx="60" cy="50" rx="34" ry="11"/>
    <ellipse cx="250" cy="120" rx="34" ry="11"/>
    <ellipse cx="120" cy="200" rx="34" ry="11"/>
  </g>
</svg>
